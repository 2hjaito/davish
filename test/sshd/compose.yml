services:
  sshd:
    build: .
    ports:
      - "127.0.0.1:2222:22"
    # systemd as PID 1 needs the host's cgroup tree and a writable /run.
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    healthcheck:
      test: ["CMD", "systemctl", "is-active", "--quiet", "ssh.service"]
      interval: 2s
      retries: 15
