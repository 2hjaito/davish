# Identical servers: A and B for tests that move files between servers,
# and inner, reachable only from inside the compose network (through A),
# for ProxyJump. Bound to localhost; test only.
x-sshd: &sshd
  build: .
  # systemd as PID 1 needs the host's cgroup tree and a writable /run;
  # dockerd inside needs privileged mode.
  privileged: true
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # overlayfs cannot stack on the container's own overlay root.
    - /var/lib/docker
    - /var/lib/containerd
  tmpfs:
    - /run
    - /run/lock
  healthcheck:
    test: ["CMD", "systemctl", "is-active", "--quiet", "ssh.service"]
    interval: 2s
    retries: 15

services:
  sshd:
    <<: *sshd
    ports:
      - "127.0.0.1:2222:22"
  sshd-b:
    <<: *sshd
    ports:
      - "127.0.0.1:2223:22"
  # No published port: the only way in is a jump through sshd.
  sshd-inner:
    <<: *sshd
