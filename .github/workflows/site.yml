name: site

# Builds davish.app (site/, ADR 0025) and publishes it on GitHub
# Pages. Runs when the page or the screenshots it shows change, and after
# each release, so the download buttons point at the new files. A release
# made with GITHUB_TOKEN does not trigger other workflows, hence
# workflow_run instead of the release event.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/screenshots/**"
      - "assets/social-preview*.png"
      - "assets/icon/**"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          # Read the latest release without the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
