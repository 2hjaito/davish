name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Install frontend deps
        run: make frontend-install

      # go:embed needs frontend/dist to exist before vet/test.
      - name: Build frontend
        run: cd frontend && npm run build

      - name: Check
        run: |
          go vet ./...
          go test -race ./...
          cd frontend && npm run check && npm run lint && npm run test

      - name: Audit
        run: |
          govulncheck ./...
          cd frontend && npm audit --audit-level=high

      - name: Build app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then wails build -tags webkit2_41; \
          elif [ "$RUNNER_OS" = "macOS" ]; then wails build -platform darwin/universal; \
          else wails build; fi

      - uses: actions/upload-artifact@v4
        with:
          name: davish-${{ runner.os }}
          path: build/bin/
