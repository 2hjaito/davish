name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install frontend deps
        run: make frontend-install

      # go:embed needs frontend/dist to exist before lint, vet and test.
      - name: Build frontend
        run: cd frontend && npm run build

      - name: Bundle budget
        run: cd frontend && npm run budget

      # The action downloads golangci-lint from GitHub Releases, which answers
      # 504 now and then. On any failure, lint again with the same version
      # built through the Go module proxy: a download error passes, a real
      # lint error fails again.
      - uses: golangci/golangci-lint-action@v8
        id: lint
        continue-on-error: true
        with:
          version: v2.15.0

      - name: golangci-lint (again, through the Go module proxy)
        if: steps.lint.outcome == 'failure'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run

      - name: Check
        run: |
          go vet ./...
          go test -race ./...
          cd frontend && npm run check && npm run lint && npm run test

      - name: Audit
        run: |
          govulncheck ./...
          cd frontend && npm audit --audit-level=high

      - name: Build app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then wails build -tags webkit2_41; \
          elif [ "$RUNNER_OS" = "macOS" ]; then wails build -platform darwin/universal; \
          else wails build; fi

      - uses: actions/upload-artifact@v4
        with:
          name: davish-${{ runner.os }}
          path: build/bin/

  # Talks to the throwaway sshd container from test/sshd (never a real server).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The main package links Wails, which needs these to compile on Linux.
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist; these tests never serve it, so an
      # empty placeholder saves installing Node and building the UI.
      - name: Placeholder frontend build
        run: mkdir -p frontend/dist && touch frontend/dist/.keep

      - name: Start test sshd
        run: make sshd-up
        env:
          # The runners sit in Azure; Ubuntu's own mirrors are slow from there.
          UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu

      - name: Integration tests
        run: make test-integration

      - name: Test sshd state on failure
        if: failure()
        run: |
          docker compose -f test/sshd/compose.yml exec -T sshd sh -c \
            'systemctl --failed --no-pager; systemctl status mongod --no-pager; journalctl -u mongod -n 50 --no-pager; tail -50 /var/log/mongodb/mongod.log' || true

      - name: Stop test sshd
        if: always()
        run: make sshd-down
