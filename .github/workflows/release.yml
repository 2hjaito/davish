name: release

# Pushing a tag like v1.0.0 builds Davish for macOS, Windows and Linux and
# publishes a GitHub release with the notes of that version from
# CHANGELOG.md. Uses the gh CLI that GitHub runners ship with.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The app reads its version from wails.json and its notes come from
  # CHANGELOG.md, both at the tagged commit. A tag put on a commit without
  # them ships an app that keeps asking to update (v1.4.0, v1.5.1).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches this commit
        run: scripts/check-release.sh "${GITHUB_REF_NAME#v}"

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: macos-universal
          - os: windows-latest
            target: windows-amd64
          - os: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build deps
        if: runner.os == 'Linux'
        # A hung Ubuntu mirror once held every runner for an hour; give up
        # and retry quickly instead.
        timeout-minutes: 10
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt update
          sudo apt-get $apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Install frontend deps
        run: make frontend-install

      # wails build -nsis needs makensis for the Windows installer.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          command -v makensis || choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Build
        run: |
          case "$RUNNER_OS" in
            macOS) wails build -platform darwin/universal -trimpath ;;
            Linux) wails build -tags webkit2_41 -trimpath ;;
            *) wails build -trimpath -nsis ;;
          esac

      # An installer (.pkg on macOS, .exe on Windows) plus a portable
      # archive per platform, named after the version and target.
      - name: Package
        run: |
          name="Davish-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              pkgbuild --component build/bin/Davish.app \
                --install-location /Applications \
                --identifier io.github.2hjaito.davish \
                --version "${GITHUB_REF_NAME#v}" \
                "dist/$name.pkg"
              ditto -c -k --keepParent build/bin/Davish.app "dist/$name.zip" ;;
            Linux) tar -C build/bin -czf "dist/$name.tar.gz" Davish ;;
            *)
              cp build/bin/Davish-amd64-installer.exe "dist/$name-setup.exe"
              (cd build/bin && 7z a "../../dist/$name.zip" Davish.exe) ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The checksum list, signed with the key the in-app updater trusts
      # (docs/adr/0009-self-update.md). No key, no release: an unsigned one
      # would leave users on the manual download.
      - name: Checksums and signature
        env:
          DAVISH_UPDATE_KEY: ${{ secrets.DAVISH_UPDATE_KEY }}
        run: |
          test -n "$DAVISH_UPDATE_KEY" || { echo "secret DAVISH_UPDATE_KEY is missing"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS.txt)
          go run ./cmd/updatesign sign dist/SHA256SUMS.txt

      # The section of each changelog for this version, without its heading:
      # English first, then Vietnamese folded after a marker the update
      # dialog splits on (frontend/src/lib/shell/releaseNotes.ts).
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[[^]]+\]: / { exit }
              on { print }
            ' "$1"
          }
          section CHANGELOG.en.md > en.md
          section CHANGELOG.md > vi.md
          if [ -s en.md ]; then
            cat en.md > notes.md
            if [ -s vi.md ]; then
              printf '\n<!-- davish:vi -->\n<details><summary>Tiếng Việt</summary>\n\n' >> notes.md
              cat vi.md >> notes.md
              printf '\n</details>\n' >> notes.md
            fi
          else
            cat vi.md > notes.md
          fi
          test -s notes.md || echo "Davish ${GITHUB_REF_NAME}" > notes.md
          # SignPath requires the policy on the download page too.
          url="https://github.com/${GITHUB_REPOSITORY}/blob/main/CODE_SIGNING.md"
          printf '\n---\n[Code signing policy](%s)\n' "$url" >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Davish ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
